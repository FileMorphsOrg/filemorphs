name: Feature or new tool request
description: Ask for a change to a tool, or for a tool or file type FileMorphs doesn't have yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please write in English if you can. Search open issues first: if someone already asked, add a thumbs-up reaction instead.
  - type: dropdown
    id: area
    attributes:
      label: File type
      description: Which kind of file is this about?
      options:
        - PDF
        - Images
        - Office documents (Word, Excel, PowerPoint)
        - Video
        - Audio
        - Other
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What do you want to do?
      description: Describe the task, not the button. For example, "turn 12 monthly bank statements into one spreadsheet".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The program or site you use now, and what's wrong with it.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: How often you'd use it, and examples. No confidential files.
